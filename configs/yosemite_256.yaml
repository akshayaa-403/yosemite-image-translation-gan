# Higher-resolution recipe. Needs ~11GB of VRAM at batch_size 1;
# drop to n_res_blocks 6 or crop_size 192 if you run out.
data_root: data/summer2winter_yosemite
load_size: 286
crop_size: 256
batch_size: 1
num_workers: 4

g_base_channels: 64
d_base_channels: 64
n_res_blocks: 9         # the paper's setting for 256px

epochs: 200
decay_start_epoch: 100
lr: 0.0002
beta1: 0.5
beta2: 0.999
lambda_cycle: 10.0
lambda_identity: 0.5
buffer_capacity: 50
amp: true

output_dir: runs/yosemite_256
seed: 42
sample_every: 5
checkpoint_every: 10
log_every: 200
device: auto
